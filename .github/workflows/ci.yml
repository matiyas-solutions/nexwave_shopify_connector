name: CI

on:
  push:
    branches:
      - version-1*
      - develop

  pull_request:
    branches:
      - develop
      - version-*

permissions:
  contents: read

env:
  # Keep the optional NZ integration on its tested v15 dependency set.
  NZ_FRAPPE_VERSION: v15.121.3
  NZ_ERPNEXT_VERSION: v15.121.6
  NZ_HRMS_VERSION: v15.64.6
  NZ_PAYMENTS_COMMIT: 9885a6e500104f1f160add47d55b370773e67a81
  NZ_COMMIT: 6daba050c72a295c1d475ce4f08a2c4cef2f02c0 # v1.59.7
  BRANCH: ${{ github.base_ref || github.ref_name }}

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    name: Server tests (${{ matrix.integration }})
    strategy:
      fail-fast: false
      matrix:
        # NZ supports v15; preserve the plain suite for other target branches.
        integration: ${{ fromJSON((github.base_ref || github.ref_name) == 'version-15' && '["plain", "nz"]' || '["plain"]') }}
    env:
      INTEGRATION: ${{ matrix.integration }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=3
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=3
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client pkg-config

      - name: Clone pinned NZ integration
        if: matrix.integration == 'nz'
        uses: actions/checkout@v4
        with:
          repository: one-highflyer/erpnext_new_zealand_customizations
          ref: ${{ env.NZ_COMMIT }}
          path: .ci-dependencies/erpnext_new_zealand_customizations

      - name: Setup
        run: |
          pip install frappe-bench
          frappe_branch="$BRANCH"
          if [[ "$INTEGRATION" == "nz" ]]; then
            frappe_branch="$NZ_FRAPPE_VERSION"
          fi
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch "$frappe_branch" "${{ github.workspace }}/../frappe-bench"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: ${{ github.workspace }}/../frappe-bench
        run: |
          if [[ "$INTEGRATION" == "nz" ]]; then
            bench get-app --skip-assets erpnext --branch "$NZ_ERPNEXT_VERSION"
            bench get-app --skip-assets hrms --branch "$NZ_HRMS_VERSION"
            bench get-app --skip-assets payments --branch version-15
            git -C apps/payments fetch --depth 1 upstream "$NZ_PAYMENTS_COMMIT"
            git -C apps/payments checkout --detach "$NZ_PAYMENTS_COMMIT"
            bench get-app --skip-assets erpnext_new_zealand_customizations "$GITHUB_WORKSPACE/.ci-dependencies/erpnext_new_zealand_customizations"
          else
            bench get-app --skip-assets erpnext --branch "$BRANCH"
          fi
          bench get-app --skip-assets nexwave_shopify_connector "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          if [[ "$INTEGRATION" == "nz" ]]; then
            bench --site test_site install-app hrms
            bench --site test_site install-app payments
            bench --site test_site install-app erpnext_new_zealand_customizations
          fi
          bench --site test_site install-app nexwave_shopify_connector
          bench build
          bench version
        env:
          CI: "Yes"

      - name: Run Tests
        working-directory: ${{ github.workspace }}/../frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site execute erpnext.setup.utils.before_tests
          bench --site test_site run-tests --app nexwave_shopify_connector
        env:
          TYPE: server

  server:
    name: Server
    runs-on: ubuntu-latest
    needs: tests
    if: always() && !contains(github.event.head_commit.message, 'chore(release):')
    steps:
      - name: Check server test lanes
        run: test "${{ needs.tests.result }}" = "success"
